name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - run: npm ci
            - run: npm run build

            - name: Test and package browser extension
              working-directory: browser-extension
              run: |
                  npm test
                  zip -r ../plaud-token-bridge-extension.zip \
                      manifest.json shared.js content-script.js background.js \
                      options.html options.js README.md

            - name: Generate artifact attestations
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      styles.css
                      plaud-token-bridge-extension.zip

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" \
                      --title "$TAG" \
                      --generate-notes \
                      main.js manifest.json styles.css plaud-token-bridge-extension.zip
