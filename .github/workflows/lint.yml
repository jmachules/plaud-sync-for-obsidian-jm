name: Node.js build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            # test/*.test.mjs uses `node --experimental-strip-types`, which only exists on
            # Node 22.6+ -- Node 20.x doesn't have the flag at all ("bad option" hard-fails).
            # Build and lint still run on both versions; test is 22.x-only until the test
            # script itself changes.
            - if: matrix.node-version == '22.x'
              run: npm test
            - run: npm run lint

